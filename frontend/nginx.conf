server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    # Auth service
    location = /api/login { proxy_pass http://auth_service:5000; proxy_set_header Host $host; }
    location = /api/admin { proxy_pass http://auth_service:5000; proxy_set_header Host $host; }
    location = /api/create-user { proxy_pass http://auth_service:5000; proxy_set_header Host $host; }

    # Measures service (/api/measures/...)
    location /api/measures/ {
        proxy_pass http://measures_service:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Sensor service (/api/nodos...)
    location /api/ {
        proxy_pass http://sensor_service:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Infdb service (get_data, insert_data, ...)
    location /influx/ {
        proxy_pass http://infdb_service:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket Socket.IO
    location /socket.io/ {
        proxy_pass http://infdb_service:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Frontend
    location / {
        try_files $uri $uri/ /index.html;
    }
}